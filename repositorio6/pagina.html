<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>página inicial</title>
    <style>
        body {
            background-color: #9e34db;
        }
    </style>
</head>
<body>
    <h1>Página Inicial</h1>
    <button onclick="exibirTexto()">clique</button>
    <p id="mensagem"></p>
    <script>
        function exibirTexto() {
        document.getElementById("mensagem").innerText = "In my world everyone's a pony and they all eat rainbows and poop butterflies !";
        }
    </script>
</body>
</html>
